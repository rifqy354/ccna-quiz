services:
  nginx:
    image: nginx:alpine
    ports:
      - "${HTTP_BIND:-127.0.0.1}:${HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ${CERTBOT_WEBROOT:-./data/certbot}:/var/www/certbot:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
    networks:
      - ccna
    deploy:
      resources:
        limits:
          memory: 64M

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      - INTERNAL_API_URL=http://backend:8000
      - NODE_ENV=production
    restart: unless-stopped
    networks:
      - ccna
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          memory: 256M

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # 1 gunicorn worker (saves ~200MB vs multiple uvicorn workers on 1GB RAM)
    command: gunicorn app.main:app --bind 0.0.0.0:8000 --workers 1 --worker-class uvicorn.workers.UvicornWorker --access-logfile - --error-logfile -
    volumes:
      - ${DATA_DIR:-./data}:/app/data
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///data/ccna.db
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set}
      - JWT_ALGORITHM=HS256
      - PLAYER_COOKIE_NAME=${PLAYER_COOKIE_NAME:-ccna_player}
      - PLAYER_COOKIE_MAX_AGE=${PLAYER_COOKIE_MAX_AGE:-31536000}
    restart: unless-stopped
    networks:
      - ccna
    deploy:
      resources:
        limits:
          memory: 384M
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  ccna:
    driver: bridge
