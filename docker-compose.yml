version: "3.9"

services:
  nginx:
    image: nginx:alpine
    container_name: ccna_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
    networks:
      - ccna
    deploy:
      resources:
        limits:
          memory: 64M

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ccna_frontend
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000
      - NODE_ENV=production
    restart: unless-stopped
    networks:
      - ccna
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          memory: 256M

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ccna_backend
    # 1 gunicorn worker (saves ~200MB vs multiple uvicorn workers on 1GB RAM)
    command: gunicorn app.main:app --bind 0.0.0.0:8000 --workers 1 --worker-class uvicorn.workers.UvicornWorker --access-logfile - --error-logfile -
    volumes:
      - ./data:/app/data
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///data/ccna.db
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set}
      - JWT_ALGORITHM=HS256
    restart: unless-stopped
    networks:
      - ccna
    deploy:
      resources:
        limits:
          memory: 384M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  ccna:
    driver: bridge
